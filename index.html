<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Study Pro</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f4f5ff;background:#0b1020}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:26px 16px 80px}.brand{font-size:1.4rem;font-weight:850;letter-spacing:-.6px}.brand span{color:#a5a0ff}.muted{color:#aab5cf}.panel{background:#161d32;border:1px solid #2b3550;border-radius:20px;padding:22px;margin-top:22px}h1{font-size:clamp(1.9rem,5vw,2.8rem);margin:30px 0 8px}h2{margin:0 0 16px;font-size:1.25rem}label{display:block;margin:15px 0 6px;color:#cdd6ed}select,button{font:inherit;border-radius:12px;padding:13px;width:100%}select{background:#0e1528;color:white;border:1px solid #3b4562}button{cursor:pointer;border:1px solid #455174;background:#252e48;color:white;text-align:left}button:hover{border-color:#9b91ff}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:#7268e8;border:0;text-align:center;font-weight:750;margin-top:20px}.option{margin:10px 0}.selected{border-color:#b0a8ff;background:#35366c}.correct{border-color:#44cf9a;background:#154d43}.wrong{border-color:#ff777d;background:#542d43}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{background:#273453;padding:7px 10px;border-radius:30px;font-size:.82rem}.progress{height:9px;background:#313a54;border-radius:10px;overflow:hidden;margin:20px 0}.bar{height:100%;background:#9389ff;transition:width .2s}.feedback{background:#222c46;padding:15px;border-radius:12px;margin-top:15px;line-height:1.55}.hidden{display:none}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:125px;background:#202944;padding:15px;border-radius:12px}.stat strong{font-size:1.5rem;display:block}.history{padding-left:20px;line-height:1.9}small{color:#aeb9d4}
</style></head><body><main><header class="top"><div class="brand">✦ AI <span>Study Pro</span></div><span class="pill">IT • Nätverk</span></header><section id="home"><h1>Lär dig smartare.</h1><p class="muted">Träna nätverksteknik och IT med quiz, automatisk rättning och tydliga förklaringar.</p><div class="panel"><h2>Starta ett nytt quiz</h2><label for="topic">Ämne</label><select id="topic"><option>Alla ämnen</option><option>Nätverksteknik</option><option>IT-infrastruktur</option><option>Windows Server</option><option>DNS och DHCP</option><option>IT-säkerhet</option></select><label for="level">Svårighetsgrad</label><select id="level"><option>Lätt</option><option selected>Medel</option><option>Svår</option></select><label for="count">Antal frågor</label><select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select><button id="start" class="primary">Skapa quiz →</button><p id="status" class="muted" role="status"></p><small>Utan API-nyckel används inbyggda övningsfrågor.</small></div><div class="panel"><h2>Din utveckling</h2><div class="stats"><div class="stat"><strong id="tests">0</strong><small>Genomförda quiz</small></div><div class="stat"><strong id="average">0%</strong><small>Genomsnitt</small></div></div><ol id="history" class="history"></ol></div></section><section id="quiz" class="hidden"><div class="panel"><div class="top"><span id="position" class="pill"></span><span id="score" class="pill"></span></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="primary hidden">Nästa fråga →</button></div></section><section id="result" class="hidden"><div class="panel"><h1>Quiz klart! 🎉</h1><p id="summary"></p><div class="stats"><div class="stat"><strong id="finalScore"></strong><small>Rätt svar</small></div><div class="stat"><strong id="percentage"></strong><small>Resultat</small></div></div><button class="primary" id="again">Till startsidan</button></div></section></main><script>
const $=id=>document.getElementById(id);let questions=[],index=0,points=0,answered=false,source='demo';const historyKey='ai-study-pro-history';const show=id=>['home','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));
function loadHistory(){let h=[];try{h=JSON.parse(localStorage.getItem(historyKey)||'[]')}catch{}$('tests').textContent=h.length;$('average').textContent=h.length?Math.round(h.reduce((a,b)=>a+b.percent,0)/h.length)+'%':'0%';$('history').replaceChildren();h.slice(0,5).forEach(x=>{let li=document.createElement('li');li.textContent=`${x.date}: ${x.topic} – ${x.percent}%`;$('history').append(li)})}
$('start').onclick=async()=>{let btn=$('start');btn.disabled=true;$('status').textContent='Skapar frågor…';try{let r=await fetch('/api/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:$('topic').value,level:$('level').value,count:Number($('count').value)})});let data=await r.json();if(!r.ok)throw Error(data.error||'Något gick fel');questions=data.questions;source=data.source;index=0;points=0;show('quiz');render()}catch(e){$('status').textContent=e.message}finally{btn.disabled=false}};
function render(){answered=false;let q=questions[index];$('position').textContent=`Fråga ${index+1} av ${questions.length}`;$('score').textContent=`Poäng: ${points}`;$('bar').style.width=`${100*index/questions.length}%`;$('question').textContent=q.question;$('options').replaceChildren();q.options.forEach((answer,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+answer;b.onclick=()=>choose(i);$('options').append(b)});$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('next').textContent=index===questions.length-1?'Visa resultat →':'Nästa fråga →'}
function choose(choice){if(answered)return;answered=true;let q=questions[index],correct=choice===q.answer;if(correct)points++;[...$('options').children].forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});$('feedback').textContent=(correct?'✓ Rätt! ':'✗ Inte riktigt. ')+q.explanation;$('feedback').classList.remove('hidden');$('score').textContent=`Poäng: ${points}`;$('next').classList.remove('hidden')}
$('next').onclick=()=>{index++;if(index<questions.length){render();return}let percent=Math.round(points/questions.length*100);$('finalScore').textContent=`${points}/${questions.length}`;$('percentage').textContent=percent+'%';$('summary').textContent=`${source==='ai'?'AI-genererat':'Inbyggt'} quiz i ${$('topic').value}.`;let h=[];try{h=JSON.parse(localStorage.getItem(historyKey)||'[]')}catch{}h.unshift({date:new Date().toLocaleDateString('sv-SE'),topic:$('topic').value,percent});try{localStorage.setItem(historyKey,JSON.stringify(h.slice(0,100)))}catch{}show('result')};$('again').onclick=()=>{loadHistory();$('status').textContent='';show('home')};loadHistory();
</script></body></html>
