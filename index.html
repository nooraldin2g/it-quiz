    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }

    .options { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

    .opt-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--red); color: #fca5a5; }

  let activeQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let answered = false;

  const $ = id => document.getElementById(id);

  $('start-btn').onclick = () => {
    const selectedTopic = $('topic').value;
    const requestedCount = parseInt($('count').value, 10);

    let pool = questionPool;
    if (selectedTopic !== 'all') {
      pool = questionPool.filter(item => item.topic === selectedTopic);
    }

    activeQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, requestedCount);
    currentIndex = 0;
    score = 0;

    $('setup-card').classList.add('hidden');
    $('quiz-card').classList.remove('hidden');
    renderQuestion();
  };

  function renderQuestion() {
    answered = false;
    const q = activeQuestions[currentIndex];

    $('position').textContent = `Fråga ${currentIndex + 1} av ${activeQuestions.length}`;
    $('question-text').textContent = q.q;
    $('options-container').innerHTML = '';
    $('explanation-box').classList.add('hidden');
    $('next-btn').classList.add('hidden');

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.onclick = () => handleChoice(idx, btn);
      $('options-container').appendChild(btn);
    });
  }

  function handleChoice(chosenIndex, selectedBtn) {
    if (answered) return;
    answered = true;

    const q = activeQuestions[currentIndex];
    const buttons = $('options-container').querySelectorAll('.opt-btn');

    if (chosenIndex === q.answer) {
      selectedBtn.classList.add('correct');
      score++;
    } else {
      selectedBtn.classList.add('incorrect');
      buttons[q.answer].classList.add('correct');
    }

    buttons.forEach(btn => btn.disabled = true);

    $('explanation-box').textContent = q.exp;
    $('explanation-box').classList.remove('hidden');
    $('next-btn').classList.remove('hidden');
  }

  $('next-btn').onclick = () => {
    currentIndex++;
    if (currentIndex < activeQuestions.length) {
      renderQuestion();
    } else {
      $('quiz-card').classList.add('hidden');
      $('result-card').classList.remove('hidden');
      $('score-text').textContent = `Du fick ${score} av ${activeQuestions.length} rätt! (${Math.round((score / activeQuestions.length) * 100)}%)`;
    }
  };

  $('restart-btn').onclick = () => {
    $('result-card').classList.add('hidden');
    $('setup-card').classList.remove('hidden');
  };
</script>
