<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Study Pro - IT & Nätverk</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #151c36;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f4f5ff;
      --muted: #9ca3af;
      --border: #232d56;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    main { width: 100%; max-width: 680px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 1.25rem; font-weight: 700; }
    .brand span { color: var(--primary); }
    .badge { background: #1e293b; color: #94a3b8; padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; border: 1px solid var(--border); }
    .hero { margin-bottom: 24px; }
    .hero h1 { font-size: 2rem; margin-bottom: 8px; }
    .hero p { color: var(--muted); font-size: 0.95rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    h2 { font-size: 1.2rem; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0e152e; color: var(--text); font-size: 1rem; margin-bottom: 16px; outline: none; }
    button.btn-primary { background: var(--primary); color: #fff; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button.btn-primary:hover { background: var(--primary-hover); }
    .options { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .opt-btn { background: #111833; border: 1px solid var(--border); padding: 14px; text-align: left; border-radius: 8px; cursor: pointer; color: var(--text); font-size: 0.95rem; transition: 0.2s; }
    .opt-btn:hover:not(:disabled) { border-color: var(--primary); }
    .opt-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--green); color: #86efac; }
    .opt-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--red); color: #fca5a5; }
    .explanation { margin-top: 14px; padding: 12px; background: #0d142c; border-radius: 6px; border-left: 4px solid var(--primary); font-size: 0.85rem; color: #cbd5e1; }
    .hidden { display: none; }
    .progress-bar { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">✦ AI <span>Study Pro</span></div>
    <div class="badge">IT • Nätverk</div>
  </header>

  <div class="hero">
    <h1>Lär dig smartare.</h1>
    <p>Träna nätverksteknik och IT med quiz, automatisk rättning och förklaringar.</p>
  </div>

  <div id="setup-card" class="card">
    <h2>Starta ett nytt quiz</h2>
    <label>Ämne</label>
    <select id="topic">
      <option value="all">Alla ämnen (Blandat)</option>
      <option value="infra">IT-infrastruktur & Protokoll</option>
      <option value="sec">IT-säkerhet & Nätverk</option>
    </select>

    <label>Antal frågor</label>
    <select id="count">
      <option value="5">5</option>
      <option value="10" selected>10</option>
    </select>

    <button id="start-btn" class="btn-primary">Skapa quiz ➔</button>
  </div>

  <div id="quiz-card" class="card hidden">
    <div class="progress-bar" id="position">Fråga 1 av 10</div>
    <h3 id="question-text" style="font-size: 1.1rem; line-height: 1.4;"></h3>
    <div class="options" id="options-container"></div>
    <div id="explanation-box" class="explanation hidden"></div>
    <button id="next-btn" class="btn-primary hidden" style="margin-top: 16px;">Nästa fråga ➔</button>
  </div>

  <div id="result-card" class="card hidden">
    <h2>Quiz slutfört!</h2>
    <p id="score-text" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
    <button id="restart-btn" class="btn-primary">Kör igen ➔</button>
  </div>
</main>

<script>
  const questionPool = [
    {
      topic: "infra",
      q: "Vilket protokoll ansvarar för att automatiskt tilldela IP-adresser på ett lokalt nätverk?",
      options: ["DNS", "DHCP", "ARP", "BGP"],
      answer: 1,
      exp: "DHCP (Dynamic Host Configuration Protocol) delar ut dynamiska IP-adresser automatiskt till enheter på nätverket."
    },
    {
      topic: "infra",
      q: "Vilket skikt i OSI-modellen hanterar routning och logisk adressering (t.ex. IP)?",
      options: ["Skikt 2 (Datalänk)", "Skikt 3 (Nätverk)", "Skikt 4 (Transport)", "Skikt 7 (Applikation)"],
      answer: 1,
      exp: "Skikt 3 (Nätverksskiktet) ansvarar för logisk adressering via IP och routning mellan nätverk."
    },
    {
      topic: "infra",
      q: "Vilket portnummer används som standard för okrypterad HTTP-trafik?",
      options: ["22", "53", "80", "443"],
      answer: 2,
      exp: "Port 80 används för standard HTTP. HTTPS använder port 443 och SSH använder port 22."
    },
    {
      topic: "infra",
      q: "Vad gör en DNS-server på ett nätverk?",
      options: ["Krypterar datapaket", "Översätter domännamn till IP-adresser", "Skyddar mot virus", "Begränsar bandbredd"],
      answer: 1,
      exp: "DNS (Domain Name System) fungerar som internetets telefonbok och mappar adresser som 'google.com' till dess IP."
    },
    {
      topic: "infra",
      q: "Vilket av följande protokoll garanterar att datapaket kommer fram i ordning (connection-oriented)?",
      options: ["UDP", "ICMP", "TCP", "IGMP"],
      answer: 2,
      exp: "TCP (Transmission Control Protocol) säkerställer pålitlig och sekvenserad överföring via handskakning och kvittens."
    },
    {
      topic: "sec",
      q: "Vad kallas en cyberattack där flera datorer skickar massiv trafik mot en server för att sänka den?",
      options: ["Phishing", "DDoS", "SQL Injection", "Man-in-the-Middle"],
      answer: 1,
      exp: "DDoS (Distributed Denial of Service) överbelastar en server genom floder av nätverkstrafik från många källor."
    },
    {
      topic: "sec",
      q: "Vad är huvudsyftet med en brandvägg (Firewall)?",
      options: ["Att öka internetets hastighet", "Att blockera och filtrera obehörig nätverkstrafik", "Att dela ut IP-adresser", "Att lagra backup"],
      answer: 1,
      exp: "En brandvägg övervakar inkommande och utgående nätverkstrafik och bestämmer vad som ska tillåtas utifrån regler."
    },
    {
      topic: "sec",
      q: "Vilket protokoll används för att etablera en säker, krypterad anslutning över ett öppet nätverk?",
      options: ["FTP", "Telnet", "VPN (t.ex. IPsec/WireGuard)", "SNMP"],
      answer: 2,
      exp: "En VPN skapar en krypterad tunnel genom vilken trafik transporteras säkert över osäkra nätverk."
    },
    {
      topic: "sec",
      q: "Vad skiljer asymmetrisk kryptering från symmetrisk kryptering?",
      options: ["Asymmetrisk använder två nycklar (offentlig och privat)", "Asymmetrisk använder inga nycklar alls", "Symmetrisk är omöjlig att knäcka", "Asymmetrisk används bara på lokala diskar"],
      answer: 0,
      exp: "Asymmetrisk kryptering använder ett nyckelpar: en publik nyckel för kryptering och en privat nyckel för dekryptering."
    },
    {
      topic: "sec",
      q: "Vad innebär termen 'NAT' (Network Address Translation)?",
      options: ["Att översätta privata IP-adresser till en publik IP", "Att förhindra intrång", "Att kryptera e-post", "Att kontrollera kabelbrott"],
      answer: 0,
      exp: "NAT gör att många enheter i ett lokalt nätverk kan dela på en enda publik IP-adress ut mot internet."
    }
  ];

  let activeQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let answered = false;

  const $ = id => document.getElementById(id);

  $('start-btn').onclick = () => {
    const selectedTopic = $('topic').value;
    const requestedCount = parseInt($('count').value, 10);

    let pool = questionPool;
    if (selectedTopic !== 'all') {
      pool = questionPool.filter(item => item.topic === selectedTopic);
    }

    activeQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, requestedCount);
    currentIndex = 0;
    score = 0;

    $('setup-card').classList.add('hidden');
    $('quiz-card').classList.remove('hidden');
    renderQuestion();
  };

  function renderQuestion() {
    answered = false;
    const q = activeQuestions[currentIndex];

    $('position').textContent = `Fråga ${currentIndex + 1} av ${activeQuestions.length}`;
    $('question-text').textContent = q.q;
    $('options-container').innerHTML = '';
    $('explanation-box').classList.add('hidden');
    $('next-btn').classList.add('hidden');

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.onclick = () => handleChoice(idx, btn);
      $('options-container').appendChild(btn);
    });
  }

  function handleChoice(chosenIndex, selectedBtn) {
    if (answered) return;
    answered = true;

    const q = activeQuestions[currentIndex];
    const buttons = $('options-container').querySelectorAll('.opt-btn');

    if (chosenIndex === q.answer) {
      selectedBtn.classList.add('correct');
      score++;
    } else {
      selectedBtn.classList.add('incorrect');
      buttons[q.answer].classList.add('correct');
    }

    buttons.forEach(btn => btn.disabled = true);

    $('explanation-box').textContent = q.exp;
    $('explanation-box').classList.remove('hidden');
    $('next-btn').classList.remove('hidden');
  }

  $('next-btn').onclick = () => {
    currentIndex++;
    if (currentIndex < activeQuestions.length) {
      renderQuestion();
    } else {
      $('quiz-card').classList.add('hidden');
      $('result-card').classList.remove('hidden');
      $('score-text').textContent = `Du fick ${score} av ${activeQuestions.length} rätt! (${Math.round((score / activeQuestions.length) * 100)}%)`;
    }
  };

  $('restart-btn').onclick = () => {
    $('result-card').classList.add('hidden');
    $('setup-card').classList.remove('hidden');
  };
</script>
</body>
</html>
